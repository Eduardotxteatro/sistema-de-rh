<div class="page-container">
  <p-card styleClass="custom-page-card">
    <ng-template pTemplate="header">
      <div class="card-header-bar flex justify-content-between align-items-center" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #2c3e50; color: #fff;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <i *ngIf="icon" [class]="icon" style="font-size: 3rem; color: #3495eb;"></i>
          <div>
            <h3 style="margin: 0; color: #ffffff;">{{ title }}</h3>
            <small *ngIf="subtitle" style="color: #cbd5e1;">{{ subtitle }}</small>
          </div>
        </div>

        <div class="header-actions">
          <ng-content select="[header-actions]"></ng-content>
        </div>
      </div>
    </ng-template>

    <!-- O corpo principal onde a p-table é projetada -->
    <div style="padding-top: 1rem;">
      <ng-content></ng-content>
    </div>
  </p-card>
</div>
