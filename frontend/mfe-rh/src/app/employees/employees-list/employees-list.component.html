<app-page-card title="Gestão de Colaboradores" subtitle="Listagem integrada ao banco de dados Oracle"
    icon="pi pi-users">

    <!-- Botões de ação no cabeçalho padronizado -->
    <div header-actions class="flex gap-2">
        <p-button label="Novo Colaborador" icon="pi pi-plus" styleClass="p-button-sm p-button-success">
        </p-button>
        <p-button icon="pi pi-refresh" styleClass="p-button-sm p-button-outlined p-button-secondary"
            (onClick)="onLazyLoad({ first: 0, rows: rows })">
        </p-button>
    </div>

    <p-menu #menu [popup]="true" [model]="visibleItems"></p-menu>

    <!-- A sua tabela p-table existente, protegida pelo card -->
    <p-table 
        [columns]="typeColumns"
        [value]="dataEmployees" 
        [paginator]="true" 
        [rows]="rows" 
        [totalRecords]="totalRecords" 
        [lazy]="true"
        
        (onLazyLoad)="onLazyLoad($event)"
        responsiveLayout="scroll"
        styleClass="p-datatable-striped p-datatable-gridlines">

        <!-- Receba as colunas pelo let-columns -->
        <ng-template pTemplate="header" let-columns>
            <tr>
            <th *ngFor="let col of columns" [pSortableColumn]="col.field" [style.width]="col.width">
                {{ col.header }}
                <p-sortIcon *ngIf="col.field" [field]="col.field"></p-sortIcon>
                
            </th>
            <th style="width: 110px; text-align: center;">Ações</th>
            </tr>
        </ng-template>

        <!-- No body, também pode usar let-columns para ficar dinâmico ou manter manual -->
        <ng-template pTemplate="body" let-employee>
            <tr>
            <td>{{ employee.EMPLOYEE_ID }}</td>
            <td>{{ employee.FIRST_NAME }}</td>
            <td>{{ employee.LAST_NAME }}</td>
            <td>{{ employee.EMAIL }}</td>
            <td>{{ employee.PHONE_NUMBER }}</td>
            <td>{{ employee.HIRE_DATE | date: 'dd/MM/yyyy' }}</td>
            <td style="text-align: center;">
                
                <button
                    pButton
                    type="button"
                    icon="pi pi-ellipsis-v"
                    class="p-button-text p-button-rounded"
                    (click)="setVisibleItems(employee); menu.toggle($event)">
                </button>
            </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
            <td [attr.colspan]="typeColumns.length + 1" class="text-center p-4">
                Nenhum registro encontrado no Oracle.
            </td>
            </tr>
        </ng-template>
        </p-table>
        <p-confirmDialog></p-confirmDialog>

</app-page-card>
